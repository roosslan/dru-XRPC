# Сборка drU6-XRPC и публикация dru-xrpc.cab в GitHub Release.
#
# Триггеры:
#   * push в trunk                  -> сборка, cab как artifact (без релиза)
#   * push тега v* (например v1.0)  -> сборка + создание GitHub Release с cab
#   * ручной запуск (workflow_dispatch)
#

name: build-and-release

on:
  push:
    branches: [ trunk ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build drU6-XRPC + pack CAB
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release / AnyCPU)
        shell: cmd
        run: msbuild drU6-XRPC.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal

      - name: Verify exe
        shell: pwsh
        run: |
          $exe = 'bin\Release\drU6-XRPC.exe'
          if (-not (Test-Path $exe)) { throw "Не найден exe: $exe" }
          Write-Host "OK: $((Get-Item $exe).Length) байт"

      - name: Create dru-xrpc.cab
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          makecab /V1 bin\Release\drU6-XRPC.exe dist\dru-xrpc.cab

      - name: Upload CAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dru-xrpc
          path: dist\dru-xrpc.cab
          if-no-files-found: error

      - name: GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\dru-xrpc.cab
          generate_release_notes: true