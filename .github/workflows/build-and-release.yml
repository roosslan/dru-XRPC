# Сборка drU6-XRPC и публикация dru-xrpc.cab в GitHub Release.
#
# Триггеры:
#   * push в trunk                  -> сборка, cab как artifact (без релиза)
#   * push тега v* (например v1.0)  -> сборка + создание GitHub Release с cab
#   * ручной запуск (workflow_dispatch)
#

name: build-and-release

on:
  push:
    branches: [ trunk ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build drU6-XRPC + pack CAB
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release / AnyCPU)
        shell: cmd
        run: msbuild drU6-XRPC.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal

      - name: Verify exe
        shell: pwsh
        run: |
          $exe = 'bin\Release\drU6-XRPC.exe'
          if (-not (Test-Path $exe)) { throw "Не найден exe: $exe" }
          Write-Host "OK: $((Get-Item $exe).Length) байт"

      - name: Create dru-xrpc.cab (exe + dependencies)
        shell: pwsh
        run: |
          $stage = 'dist\contents'
          New-Item -ItemType Directory -Force dist, $stage | Out-Null

          # exe + все runtime-зависимости. В bin\Release уже лежат и Required\*.dll,
          # и stdole.dll (в Required его нет, но он нужен). .config исключаем —
          # там Drupal.ServiceKey, .pdb не включаем.
          Copy-Item 'bin\Release\drU6-XRPC.exe' -Destination $stage -Force
          Get-ChildItem 'bin\Release\*.dll' | Copy-Item -Destination $stage -Force

          $files = Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object { $_.Name }
          $ddf = @(
            '.OPTION EXPLICIT',
            '.Set CabinetNameTemplate=dru-xrpc.cab',
            '.Set DiskDirectoryTemplate=..\',
            '.Set CompressionType=LZX',
            '.Set CompressionMemory=21',
            ''
          ) + ($files | ForEach-Object { '"' + $_ + '"' })
          [IO.File]::WriteAllText((Join-Path $stage 'pkg.ddf'), ($ddf -join "`r`n"))

          Push-Location $stage
          try { makecab /F pkg.ddf | Out-Null } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "makecab failed: $LASTEXITCODE" }

          $cab = 'dist\dru-xrpc.cab'
          if (-not (Test-Path $cab)) { throw "cab не создан: $cab" }
          Write-Host "OK: $((Get-Item $cab).Length) байт"

      - name: Verify cab contents (6 files)
        shell: pwsh
        run: |
          $out = & "$env:SystemRoot\System32\expand.exe" -D (Join-Path $env:GITHUB_WORKSPACE 'dist\dru-xrpc.cab') 2>&1
          $members = $out | Where-Object { $_ -match '\.(exe|dll)\s*$' } | ForEach-Object { ($_ -split ':')[-1].Trim() } | Sort-Object
          $members | ForEach-Object { Write-Host "  $_" }
          if ($members.Count -ne 6) { throw "Ожидалось 6 файлов в cab, найдено $($members.Count)" }

      - name: Upload CAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dru-xrpc
          path: dist\dru-xrpc.cab
          if-no-files-found: error

      - name: GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\dru-xrpc.cab
          generate_release_notes: true